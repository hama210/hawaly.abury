name: Temporary Google translation preview smoke
on:
  push:
    branches:
      - fix/google-only-translation-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-google-sorani:
    runs-on: ubuntu-latest
    steps:
      - name: Verify real Google Sorani translation in Cloudflare Pages preview
        run: |
          node --input-type=module <<'NODE'
          const url='https://fix-google-only-translation.hawaly-aburyy.pages.dev/api/translation-health';
          let last='';
          for(let attempt=0;attempt<9;attempt++){
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
              const raw=await response.text();
              const data=JSON.parse(raw);
              console.log(JSON.stringify({attempt:attempt+1,status:response.status,ok:data.ok,provider:data.provider,failure:data.failure,sampleTranslation:data.sampleTranslation}));
              if(response.ok && data.ok===true && /^google-(cloud|public)$/.test(data.provider) && /[\u0600-\u06ff]/u.test(data.sampleTranslation||'')) process.exit(0);
              last=data.failure || 'translation response invalid';
            }catch(e){last=String(e?.message||e);console.log('Preview not available:',last);}
            await new Promise(resolve=>setTimeout(resolve,8000));
          }
          console.error('Live Google Sorani translation did not pass:',last);
          process.exit(1);
          NODE
