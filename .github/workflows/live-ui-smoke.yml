name: Live Mobile and Desktop UI Smoke

on:
  push:
    branches:
      - master
      - fix/v64-no-flash-fresh-news
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Wait for new production deployment on master
        if: github.ref_name == 'master'
        shell: bash
        run: |
          for attempt in $(seq 1 25); do
            version=$(curl -L -sS -D - -o /dev/null --max-time 12 https://hawaly-aburyy.pages.dev/ | tr -d '\r' | grep -i '^x-hawall-version:' | tail -n 1 | awk '{print $2}' || true)
            if [[ "$version" == "2026-10-news-v6.4" ]]; then
              echo "Hawall v6.4 is deployed in production"
              exit 0
            fi
            echo "Waiting for production v6.4, observed: ${version:-none}"
            sleep 6
          done
          exit 1
      - name: Verify deployed mobile and desktop interface
        env:
          SITE_URL: ${{ github.ref_name == 'master' && 'https://hawaly-aburyy.pages.dev/' || 'https://fix-v64-no-flash-fresh-news.hawaly-aburyy.pages.dev/' }}
        run: node scripts/smoke-live-ui.mjs
      - name: Keep mobile/desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hawall-browser-smoke
          path: |
            hawall-mobile-smoke.png
            hawall-desktop-smoke.png
          if-no-files-found: ignore
