name: Live News Health

on:
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'
  push:
    branches:
      - fix/v64-no-flash-fresh-news

permissions:
  contents: read

jobs:
  live-news:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch current Cloudflare news feed
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --show-error --silent --connect-timeout 12 --max-time 75 --retry 1 \
            --header 'Accept: application/json' \
            --header 'User-Agent: Hawall-health-check/1.0' \
            'https://hawaly-aburyy.pages.dev/api/news?mode=fast&refresh=1' > news-health.json
      - name: Verify truly recent publisher headlines
        shell: bash
        run: |
          python3 - <<'PY'
          import json, datetime, sys
          with open('news-health.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          stats = payload.get('feedStats') or {}
          items = payload.get('items') or []
          checked = payload.get('updatedAt')
          print('API checkedAt:', checked)
          print('API status:', payload.get('status'))
          print('Sources requested/succeeded/failed:',stats.get('requested'),stats.get('succeeded'),stats.get('failed'))
          print('Headlines:', len(items))
          now = datetime.datetime.now(datetime.timezone.utc)
          recent = 0
          for item in items[:12]:
              raw = item.get('publishedAt','')
              try:
                  published = datetime.datetime.fromisoformat(raw.replace('Z','+00:00'))
              except ValueError:
                  try:
                      from email.utils import parsedate_to_datetime
                      published = parsedate_to_datetime(raw)
                  except Exception:
                      print('  INVALID DATE:',raw)
                      continue
              age_h = (now-published).total_seconds()/3600
              recent += (0 <= age_h <= 24)
              print('  age_hours=%.1f source=%s title=%s' % (age_h,item.get('source','?'),item.get('title','')[:100]))
          for source in stats.get('sources',[]):
              print('SOURCE %s: %s (%s); %s' % (source.get('source'),source.get('status'),source.get('articles'),str(source.get('reason',''))[:80]))
          if not items or not stats.get('succeeded'):
              sys.exit('FAIL: no live headlines from publishers')
          if not recent:
              sys.exit('FAIL: no headline from the latest 24 hours in the first twelve')
          print('PASS: recent real publisher headlines available')
          PY
