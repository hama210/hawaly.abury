name: Public Hawal website smoke audit

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - fix/hawal-audit-reliability-20261111
    paths:
      - 'scripts/live-audit.mjs'
      - '.github/workflows/live-audit.yml'
      - 'functions/api/news.js'
      - 'functions/_middleware.js'
      - 'public/sw.js'
      - 'src/components/EconomicCalendar.jsx'
      - 'src/components/GoldSilverCenter.jsx'
      - 'src/lib/metals-center.js'
      - 'src/lib/metals-copy.js'
      - 'functions/api/metals-history.js'
      - 'functions/owner-health/api.js'
      - 'functions/lib/owner-auth.js'
      - 'src/lib/source-health.js'
      - 'functions/lib/owner-watch-status.js'
      - 'scripts/owner-health-watch.mjs'
      - '.github/workflows/owner-health-watch.yml'
      - 'src/components/OwnerHealth.jsx'
      - 'public/sitemap.xml'

permissions:
  contents: read

jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit public HTML pages and JSON endpoints
        run: node scripts/live-audit.mjs
